function classify(text){
 const t=String(text||'').toLowerCase().replace(/ё/g,'е');
 if(/не\s*звон|больше\s*не\s*звон|убер(ите|и).*номер|удали(те|ть).*номер|не\s*беспоко|прекрат.*звон|отказ.*контакт/.test(t))return 'stop';
 if(/перезвон|неудобно|сейчас\s*занят|позже\s*поговор|нет\s*времени/.test(t))return 'busy';
 if(/стро(йк|ительств).*(встал|останов|замор)|проект\s*замор|замороз|приостанов/.test(t))return 'frozen';
 if(/нет\s*(новых\s*)?заказ|нет\s*объект/.test(t))return 'no_orders';
 if(/нет\s*денег|бюджет\s*не\s*утвержд|без\s*аванса|аванс.*нет/.test(t))return 'no_budget';
 if(/дорог|переплат|высок.*ставк|платеж.*высок/.test(t))return 'price';
 if(/конкурент|друг(ой|ая)\s*лизинг|другой\s*банк|уже\s*считал/.test(t))return 'competitor';
 if(/купили|приобрели|уже\s*взяли/.test(t))return 'bought';
 if(/перенес|отлож|отсроч|потом|через\s*полгода/.test(t))return 'delay';
 if(/не\s*планир|не\s*актуаль|не\s*интерес|не\s*нужн/.test(t))return 'no_need';
 if(/расчет|рассчит|платеж|услови|сколько\s*будет/.test(t))return 'calculation';
 if(/экскаватор|самосвал|оборудован|грузовик|станок|автомобил|трактор|комбайн/.test(t))return 'asset';
 return 'unclear';
}

function work(){const scenario=scenarios.find(s=>s.id===call.scenario),n=getNode(call.node),c=ctx(),known=Object.entries(call.data).filter(([k,v])=>v&&fieldLabels[k]);const candidates=Object.entries(fieldLabels).filter(([k])=>!call.data[k]).slice(0,4);const visible=n.choices.filter(a=>a.to!=='FINISH');const terminal=n.terminal;const all=showAllChoices?visible:visible.slice(0,6);const progress=['start','asset','cost','timing','next'];const progressI=call.node.endsWith('_start')?0:['asset','cold_need','choose_asset','no_need','not_interested'].includes(call.node)?1:['cost','calculation','payment','advance','price','competitor','value','delay','no_budget','deferred'].includes(call.node)?2:['timing','decision','director','service','transfer'].includes(call.node)?3:4;const phrases=n.phrases.map(p=>template(p,c));return `<main class="page"><div class="work-header"><div><div class="kicker">${esc(scenario.title)}${call.scenario==='campaign'?` · ${esc(c.name)}`:''}</div><div class="work-title">${esc(n.title)}</div><div class="work-sub">${esc(n.goal)}</div></div><div class="work-actions"><button class="btn" data-act="back" ${call.history.length?'':'disabled'}>← Назад</button><button class="btn btn-danger" data-act="finish">Завершить</button></div></div><div class="workspace"><div class="mainwork"><section class="box focus ${terminal?'danger-panel':''}"><div class="progress" aria-label="Этап переговоров">${progress.map((_,i)=>`<span class="progbar ${i<=progressI?'done':''}"></span>`).join('')}</div><div class="stephead"><div><div class="stepbadge">${esc(n.eyebrow||'Диалог')}</div><div class="stepgoal">${esc(n.goal)}</div></div>${n.intro?'<div class="intro-check"><span></span> Представление по имени</div>':''}</div><div class="quote"><div class="quote-label">Что сказать клиенту сейчас</div><div class="quote-body" id="current-phrase">${esc(phrases[tone]||phrases[0])}</div></div><div class="phrase-controls"><div class="tone-group" aria-label="Стиль формулировки">${['Нейтрально','Разговорно','Коротко'].map((label,i)=>`<button class="tone ${tone===i?'active':''}" data-tone="${i}">${label}</button>`).join('')}</div><button class="btn" data-act="copy-phrase">▧ Копировать фразу</button></div><div class="quick-header"><h2>${terminal?'Что сделать?':'Как ответил клиент?'}</h2><small>${terminal?'Завершить без дополнительных вопросов':'Выберите подходящий вариант · 1–9'}</small></div><div class="choices">${all.map((choice,i)=>`<button class="choice" data-choice="${i}" title="${esc(choice.detail||choice.label)}"><span>${esc(choice.label)}</span><span class="arr">↗</span></button>`).join('')}${n.choices.some(p=>p.to==='FINISH')?`<button class="choice" data-act="finish"><span>Сформировать итог для CRM</span><span class="arr">↗</span></button>`:''}</div>${visible.length>6?`<div style="margin-top:12px"><button class="mini-button" data-act="more">${showAllChoices?'Скрыть лишние варианты':'Показать еще '+(visible.length-6)+' вариантов ↓'}</button></div>`:''}<div class="nextrow"><div class="inline-tools"><button class="btn" data-act="qualification">⌁ Квалификация</button><button class="btn" data-act="objections">▤ Возражения</button><button class="btn" data-act="skip">Пропустить →</button></div><button class="mini-button" data-act="finish">Итог для CRM →</button></div></section><section class="box freebox"><h2>Клиент ответил иначе?</h2><p>Введите его слова своими словами. Подберем проверенную ветку и следующий вопрос. Это правила, не генеративный ИИ.</p><textarea class="textarea" id="freeAnswer" placeholder="Например: хотели взять два самосвала, но стройки остановились">${esc(freeText)}</textarea><div class="free-action"><button class="btn btn-primary" data-act="assist">✦ Помоги ответить <span class="esc">Ctrl ↵</span></button></div>${assistantResult?assistHtml():''}</section></div><aside class="right"><div class="box cardpad"><div class="aside-head"><h2>Что уже известно</h2><span class="mini-pill">${known.length} фактов</span></div>${known.length?`<dl class="known">${known.slice(0,5).map(([k,v])=>`<div class="knownrow"><dt>${esc(fieldLabels[k])}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:`<p class="empty" style="margin-top:16px">Еще нет подтвержденных сведений о потребности.</p>`}<button class="btn side-tool" data-act="edit-card">＋ Заполнить карточку</button><div class="rule" style="margin:17px 0"></div><div class="kicker">Что осталось уточнить</div><div class="missing">${candidates.map(([k,v])=>`<span class="chip">${esc(v)}</span>`).join('')||'<span class="tiny">Все базовые ориентиры записаны</span>'}</div><div class="input-help">Не создавайте ЛЗ автоматически. Проверьте корпоративные критерии.</div></div><div class="box action-box"><div class="aside-head"><h2>Следующий шаг</h2><span class="mini-pill">Подсказка</span></div><p class="empty" style="margin-bottom:0">${terminal?'Прекратите рекламные контакты. Отказ нужно передать в централизованный стоп-лист.':call.node==='noanswer'?'Зафиксируйте недозвон, а не результат переговоров.':call.node==='calculation'?'Уточните исходные данные и передайте запрос на расчет в установленном порядке.':'Выясняйте только то, чего еще не знаете. После подтверждения потребности предложите конкретный следующий шаг.'}</p></div>${call.history.length?`<div class="box history-box"><div class="aside-head"><h2>История диалога</h2><span class="mini-pill">${call.history.length}</span></div>${call.history.slice(-4).map((h,ind)=>`<div class="hist-item"><b>${esc(h.title)}</b><div>${esc(h.answer.slice(0,85))}</div><button class="mini-button" data-rewind="${call.history.length-Math.min(call.history.length,4)+ind}">Исправить</button></div>`).join('')}</div>`:''}</aside></div><div class="sticky-tools"><div><button class="btn btn-light" data-act="assist-focus">✦ Помоги ответить</button><button class="btn" data-act="objections">Возражения</button><button class="btn btn-danger" data-act="stop">Не звонить</button></div><div><button class="btn" data-act="finish">Итог для CRM →</button></div></div></main>`}
function assistHtml(){const a=assistantResult,n=getNode(a.to);return `<div class="assist-results"><div class="kicker">Рекомендация · ${esc(n.title)}</div><p class="tiny">${esc(hypothesis[a.to]||'Уточните ситуацию и не делайте предположений.')}</p>${n.phrases.map(p=>`<div class="assist-variant">«${esc(template(p,ctx()))}»</div>`).join('')}<div class="free-action"><button class="btn btn-primary" data-act="accept-assist">Сохранить ответ и перейти →</button></div></div>`}
function summary(){const s=scenarios.find(s=>s.id===call.scenario);return `<main class="page"><div class="layout-simple"><div class="kicker">Завершение разговора</div><h1>Готовый комментарий для CRM</h1><p class="muted">Проверьте и при необходимости исправьте текст. Ничего не отправляется в WebCRM автоматически.</p><section class="box cardpad"><label class="input-label">Результат контакта</label><select id="outcome" class="input">${['Контакт установлен, потребность подтверждена (требуется проверка ЛЗ)','Потенциальная потребность','Отложенная потребность','Потребности нет','Нет контакта','Сервисное обращение','Отказ от дальнейших контактов'].map(a=>`<option ${call.outcome===a?'selected':''}>${esc(a)}</option>`).join('')}</select><div class="formrow"><label class="input-label">Комментарий для WebCRM</label><textarea class="textarea summary-area" id="crmSummary">${esc(call.crmDraft??makeSummary())}</textarea></div><div class="nextrow"><div class="inline-tools"><button class="btn" data-act="return">← К диалогу</button><button class="btn" data-act="new">Новый звонок</button></div><button class="btn btn-primary" data-act="copy-crm">▧ Скопировать комментарий</button></div>${call.node==='stop'||call.data.stop?'<div class="blocked" style="margin-top:19px"><b>Отказ от рекламных контактов.</b> Копирование комментария не добавляет телефон в корпоративный стоп-лист. Необходимо передать отказ в утвержденную систему учета.</div>':''}</section></div></main>`}
function makeSummary(){const sc=scenarios.find(q=>q.id===call.scenario);let parts=[`Канал: ${sc.title}.`,`Специалист: ${operatorName}.`];for(const [key,label]of Object.entries(fieldLabels)){if(call.data[key])parts.push(`${label}: ${call.data[key]}.`)}if(call.history.length){let entries=call.history.filter(h=>h.answer!=='Этап пропущен').map(h=>h.answer).slice(-5);if(entries.length)parts.push('Ответы клиента: '+entries.join('; ')+'.')}if(call.data.stop||call.node==='stop')parts.push('Отказ от рекламных контактов. Требуется фиксация в корпоративном стоп-листе.');return parts.join('\n')}
function makeOutcome(){if(call.data.stop||call.node==='stop')return 'Отказ от дальнейших контактов';if(call.node==='noanswer')return 'Нет контакта';if(call.scenario==='incoming'&&['service','transfer','status'].includes(call.node))return 'Сервисное обращение';if(['delay','deferred','frozen','no_orders','no_budget'].includes(call.node)||call.history.some(h=>['delay','frozen','no_orders'].includes(h.to)))return 'Отложенная потребность';if(['no_need','not_interested','wrong'].includes(call.node))return 'Потребности нет';if(call.data.asset&&call.data.timing)return 'Контакт установлен, потребность подтверждена (требуется проверка ЛЗ)';return 'Потенциальная потребность'}
function modalView(){if(!modal)return '';let title='',body='';if(modal==='card'){title='Карточка потребности';body=`<p class="muted" style="font-size:13px;line-height:1.5">Записывайте только сказанное клиентом. Поля необязательны на раннем этапе. Не вводите реальные персональные данные в публичную демоверсию.</p>${fieldGroups.map(g=>`<div class="rule"></div><h3 style="font-size:14px">${esc(g.title)}</h3><div class="fieldgrid">${g.fields.map(([id,label])=>`<label>${esc(label)}<input class="input" data-field="${id}" value="${esc(call.data[id]||'')}" placeholder="Не выяснено"></label>`).join('')}</div>`).join('')}<div class="nextrow"><button class="btn" data-act="close-modal">Отмена</button><button class="btn btn-primary" data-act="save-card">Сохранить карточку</button></div>`}
 else if(modal==='objections'){title='Библиотека возражений';body=`<label class="input-label">Найти ситуацию</label><input class="input" id="ob-search" placeholder="Например: дорого, потом, конкурент…" value="${esc(window.__obQuery||'')}"><div class="ob-grid" id="ob-grid" style="margin-top:14px">${renderObjections(window.__obQuery||'')}</div>${selectedOb?renderSelectedOb():''}`}
 else if(modal==='admin'){title='Редактор формулировок';const nodeOptions=Object.entries(nodes).map(([id,n])=>`<option value="${id}" ${window.__editingNode===id?'selected':''}>${esc(n.title)} · ${id}</option>`).join('');const key=window.__editingNode||'incoming_start';const n=getNode(key);body=`<div class="notice">Локальные изменения видны только в этом браузере. Это не корпоративная публикация и не согласование юридически значимых правок. Имя специалиста подставляется через <code>{{name}}</code>, не удаляйте эту конструкцию из приветствия.</div><div class="formrow"><label class="input-label">Этап разговора</label><select class="input" id="edit-node">${nodeOptions}</select></div>${n.phrases.map((p,i)=>`<div class="formrow"><label class="input-label">${['Нейтральный','Разговорный','Короткий'][i]} вариант</label><textarea class="textarea" data-edit-phrase="${i}">${esc(p)}</textarea></div>`).join('')}<div class="nextrow"><button class="btn" data-act="close-modal">Отмена</button><button class="btn btn-primary" data-act="save-template">Сохранить локально</button></div>`}
 else if(modal==='legal'){title='Ограничения пилотной версии';body=`<div class="notice">Данная версия предназначена для методологического тестирования на обезличенных примерах, а не для обработки реальных клиентских данных.</div><ul class="flat-list"><li>Имя специалиста сохраняется только в браузере.</li><li>Текущий диалог хранится в пределах вкладки браузера.</li><li>Нет серверных учетных записей, ролей и централизованного стоп-листа.</li><li>Проверка согласий на исходящие звонки демонстрационная. Для реальной работы нужна проверяемая корпоративная система.</li><li>WebCRM, телефония и внешний ИИ не подключены.</li><li>Показанные фразы — методологический пилот до согласования с компанией.</li></ul>`}
 return `<div class="modal-backdrop" role="presentation" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn btn-icon" data-act="close-modal" aria-label="Закрыть">×</button></div><div class="modal-body">${body}</div></section></div>`}
function renderObjections(q=''){const match=objections.filter(o=>o.title.toLowerCase().includes(q.toLowerCase()));return match.map((ob,i)=>`<button class="ob-button" data-ob="${esc(ob.title)}">${esc(ob.title)}　↗</button>`).join('')||'<p class="empty">Совпадений не найдено.</p>'}
function renderSelectedOb(){const ob=objections.find(o=>o.title===selectedOb);if(!ob)return '';const node=getNode(ob.to);return `<div class="ob-answer"><div class="kicker">${esc(ob.title)}</div><h3>${esc(node.title)}</h3><p class="muted">${esc(node.goal)}</p>${node.phrases.map(p=>`<div class="assist-variant">«${esc(template(p,ctx()))}»</div>`).join('')}${call?`<button class="btn btn-primary" data-act="ob-go" data-next="${ob.to}">Перейти к этому этапу →</button>`:'<p class="tiny">Начните разговор, чтобы перейти к этапу.</p>'}</div>`}
function render(){root.innerHTML=header()+(page==='home'?home():page==='gate'?gateView():page==='work'?work():summary())+modalView()+`<div class="app-footer"><button class="help-link" data-act="legal">Условия использования пилота</button> · Интерлизинг · Навигатор v2.0</div>`;}
function move(to,answer){if(!call)return;if(call.node==='stop'&&to!=='FINISH'){toast('После отказа нельзя продолжать коммерческий разговор.');return}if(to==='FINISH'){finish();return}if(!nodes[to]){toast('Не найден этап диалога');return}const origin=getNode(call.node);call.history.push({from:call.node,to,answer,title:origin.title,snapshot:structuredClone(call.data),time:new Date().toISOString()});if(to==='stop')call.data.stop='Да';call.node=to;call.crmDraft=null;tone=0;freeText='';assistantResult=null;showAllChoices=false;save();render();}
function back(){if(!call?.history.length)return;const last=call.history.pop();call.node=last.from;call.data=structuredClone(last.snapshot);call.crmDraft=null;assistantResult=null;freeText='';tone=0;showAllChoices=false;save();page='work';render();}
function rewind(i){if(!call||i<0||i>=call.history.length)return;const item=call.history[i];call.node=item.from;call.data=structuredClone(item.snapshot);call.history=call.history.slice(0,i);call.crmDraft=null;assistantResult=null;freeText='';tone=0;page='work';render();}
function finish(){if(!call)return;call.outcome=call.outcome||makeOutcome();call.crmDraft=call.crmDraft??makeSummary();page='summary';save();render();}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Скопировано')}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();toast(ok?'Скопировано':'Не удалось скопировать — выделите текст вручную')}}
function checkGate(){gate.source=document.getElementById('gate-source')?.value||'';gate.evidence=document.getElementById('gate-proof')?.value.trim()||'';gate.consent=document.getElementById('gate-consent')?.checked||false;gate.manual=document.getElementById('gate-manual')?.checked||false;gate.suppressed=document.getElementById('gate-suppressed')?.checked||false;call.campaign=document.getElementById('gate-campaign')?.value||'construction';if(gate.suppressed){toast('Контакт в стоп-листе: исходящий сценарий заблокирован.');return}if(!gate.source||gate.evidence.length<4||!gate.consent||!gate.manual){toast('Сценарий заблокирован: нет всех отметок и подтверждения.');return}call.legalState='demo-attestation-only';page='work';save();render();}
function skip(){let n=getNode(call.node);if(n.intro){toast('Сначала представьтесь клиенту по имени и выберите его реакцию.');return}if(n.terminal){finish();return}const map={asset:'cost',cost:'timing',timing:'next',decision:'next',calculation:'next',payment:'next',advance:'next',choose_asset:'timing',cold_need:'close'};move(map[call.node]||'close','Этап пропущен')}
function help(){freeText=document.getElementById('freeAnswer')?.value.trim()||'';if(!freeText){toast('Введите слова клиента');return}assistantResult={to:classify(freeText)};render();setTimeout(()=>document.querySelector('.assist-results')?.scrollIntoView({behavior:'smooth',block:'nearest'}),0)}
function openObjections(){modal='objections';selectedOb=null;window.__obQuery='';render();document.getElementById('ob-search')?.focus()}
function changeName(){page='home';modal=null;nameError=false;render();document.getElementById('operatorName')?.focus()}
function clickAction(action,el){switch(action){case 'home':page='home';modal=null;render();break;case 'edit-name':changeName();break;case 'resume':if(call){page=call.node==='stop'?'summary':'work';render()}else toast('Нет незавершенного разговора');break;case 'theme':document.body.classList.toggle('dark');localStorage.setItem('il_nav_theme',document.body.classList.contains('dark')?'dark':'light');break;case 'back':back();break;case 'finish':finish();break;case 'stop':if(call)move('stop','Клиент требует прекратить рекламные контакты');break;case 'qualification':if(getNode(call.node).intro){toast('Сначала представьтесь по имени и уточните вопрос клиента.');break}move('asset','Переход к уточнению потребности');break;case 'skip':skip();break;case 'more':showAllChoices=!showAllChoices;render();break;case 'copy-phrase':copy(document.getElementById('current-phrase').textContent);break;case 'assist':help();break;case 'assist-focus':document.getElementById('freeAnswer')?.focus();document.getElementById('freeAnswer')?.scrollIntoView({behavior:'smooth',block:'center'});break;case 'accept-assist':if(assistantResult)move(assistantResult.to,freeText);break;case 'edit-card':modal='card';render();break;case 'save-card':document.querySelectorAll('[data-field]').forEach(f=>call.data[f.dataset.field]=f.value.trim());save();modal=null;render();toast('Карточка обновлена');break;case 'objections':openObjections();break;case 'close-modal':modal=null;selectedOb=null;render();break;case 'ob-go':if(call)move(el.dataset.next,`Перешли к возражению «${selectedOb}»`);modal=null;render();break;case 'admin':modal='admin';window.__editingNode='incoming_start';render();break;case 'save-template':{const key=document.getElementById('edit-node').value;const n=nodes[key];const phrases=Array.from(document.querySelectorAll('[data-edit-phrase]')).map(f=>f.value.trim());if(phrases.some(p=>!p)){toast('Все три варианта должны быть заполнены');break}if(n.intro&&phrases.some(p=>!p.includes('{{name}}')||!/интерлизинг/i.test(p))){toast('В приветствии обязательны {{name}} и Интерлизинг');break}templates[key]=phrases;localStorage.setItem(CONFIG,JSON.stringify(templates));modal=null;render();toast('Формулировки сохранены локально');break}case 'gate-continue':checkGate();break;case 'copy-crm':{const val=document.getElementById('crmSummary')?.value||'';call.crmDraft=val;save();copy(val);break}case 'return':call.crmDraft=document.getElementById('crmSummary')?.value||'';page='work';save();render();break;case 'new':{sessionStorage.removeItem(APP);call=null;page='home';freeText='';assistantResult=null;modal=null;render();break}case 'legal':modal='legal';render();break;default:break}}
root.addEventListener('click',e=>{if(e.target.closest('[data-backdrop]')&&!e.target.closest('.modal')){modal=null;render();return}const sc=e.target.closest('[data-scenario]');if(sc){startScenario(sc.dataset.scenario);return}const t=e.target.closest('[data-tone]');if(t){tone=+t.dataset.tone;render();return}const opt=e.target.closest('[data-choice]');if(opt&&call){const options=getNode(call.node).choices.filter(a=>a.to!=='FINISH');const chosen=options[+opt.dataset.choice];if(chosen)move(chosen.to,chosen.label);return}const rew=e.target.closest('[data-rewind]');if(rew){rewind(+rew.dataset.rewind);return}const ob=e.target.closest('[data-ob]');if(ob){selectedOb=ob.dataset.ob;const q=document.getElementById('ob-search')?.value||'';window.__obQuery=q;render();return}const a=e.target.closest('[data-act]');if(a)clickAction(a.dataset.act,a)});
root.addEventListener('input',e=>{if(e.target.id==='operatorName'){operatorName=e.target.value.trimStart();if(compactName(operatorName)){localStorage.setItem(OP,operatorName);nameError=false}return}if(e.target.id==='freeAnswer'){freeText=e.target.value;return}if(e.target.id==='crmSummary'&&call){call.crmDraft=e.target.value;save();return}if(e.target.id==='ob-search'){window.__obQuery=e.target.value;const grid=document.getElementById('ob-grid');if(grid)grid.innerHTML=renderObjections(e.target.value);return}if(e.target.id==='gate-proof'){gate.evidence=e.target.value}});
root.addEventListener('change',e=>{if(e.target.id==='edit-node'){window.__editingNode=e.target.value;render();return}if(e.target.id==='outcome'&&call){call.outcome=e.target.value;save();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render();return}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&page==='work'&&!modal){e.preventDefault();help();return}if(e.altKey&&e.key==='ArrowLeft'&&page==='work'&&!modal){e.preventDefault();back();return}const el=document.activeElement;if(['INPUT','TEXTAREA','SELECT'].includes(el?.tagName)||modal||page!=='work')return;if(/^[1-9]$/.test(e.key)){const b=document.querySelector(`[data-choice="${Number(e.key)-1}"]`);if(b){e.preventDefault();b.click()}}if(e.key==='/'){e.preventDefault();openObjections()}});
if(validateGraph().length)console.error('Graph errors',validateGraph());
render();

</script>
</body></html>
